name: Download and Release Game Assets & Masterdata

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force: ignore the version/release check and download + release everything'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: report what would happen, download and publish nothing'
        type: boolean
        default: false

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build sprite-atlas index
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # download_static_assets --skip-atlas needs this to tell a JewelShop icon that is a
          # real loose file from one that only lives inside an atlas bundle. Without it that
          # step warns and requests every path, and the atlas-backed ones 404.
          # Non-fatal: the run continues without the index, just less efficiently.
          python -u scripts/download_atlas_index.py || echo "atlas index build failed; continuing without it"

      - name: Run Check, Download, and Release Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Scheduled runs have no inputs, so github.event.inputs.* is empty -> no flags.
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "python -u scripts/runner.py$ARGS"
          python -u scripts/runner.py $ARGS

